<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>Akin's Dynamic Feeding Manager</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
        }
        .card { 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px); 
            border-radius: 24px; 
            padding: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 420px; 
            border: 2px solid #ffffff; 
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        h1 { font-size: 20px; color: #1e3799; text-align: center; margin-top: 0; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        h2 { font-size: 16px; color: #0984e3; text-align: center; margin-top: 0; margin-bottom: 15px; }
        
        .input-group { margin-bottom: 12px; }
        label { font-size: 13px; font-weight: 600; color: #4a69bd; margin-bottom: 5px; display: block; }
        .config-input { border: 2px solid #d1d8e0; border-radius: 12px; padding: 12px; font-size: 16px; width: 100%; box-sizing: border-box; text-align: center; color: #2f3640; font-weight: bold; background: #f8f9fa; -webkit-appearance: none; }
        .config-input:focus { border-color: #74b9ff; background: #ffffff; outline: none; }
        
        button { background: linear-gradient(135deg, #74b9ff, #0984e3); color: white; border: none; border-radius: 16px; padding: 14px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 4px 12px rgba(9, 132, 227, 0.3); transition: transform 0.1s; margin-top: 5px; }
        button:active { transform: scale(0.95); }
        
        .table-container { margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 12px; overflow: hidden; border: 1px solid #e1e8ed; }
        th { background: #f1f2f6; color: #2f3640; padding: 10px 6px; font-size: 12px; text-align: center; }
        td { padding: 8px 6px; text-align: center; border-top: 1px solid #e1e8ed; background: #fff; vertical-align: middle; }
        
        .row-time { width: 65px; padding: 6px; font-size: 14px; border: 1px solid #d1d8e0; border-radius: 8px; text-align: center; font-weight: bold; background: #f8f9fa; -webkit-appearance: none; }
        .row-vol { width: 60px; padding: 6px; font-size: 15px; border: 1px solid #d1d8e0; border-radius: 8px; text-align: center; font-weight: bold; color: #2f3640; background: #fff; -webkit-appearance: none; margin-bottom: 4px; }
        .row-vol:focus, .row-time:focus { border-color: #0984e3; outline: none; background: #f0f7ff; }
        
        .ml-badge { background: #e0f3ff; color: #0984e3; font-size: 11px; padding: 2px 6px; border-radius: 6px; font-weight: bold; display: block; margin: 0 auto; width: fit-content; }
        .status-select { font-size: 11px; padding: 4px; border-radius: 6px; border: 1px solid #ccc; background: #f1f2f6; font-weight: bold; }
        
        .summary-box { background: #fff3cd; color: #856404; padding: 12px; border-radius: 14px; margin-top: 15px; font-size: 13px; line-height: 1.5; text-align: center; border: 2px dashed #ffeeba; }
        .summary-box b { color: #d35400; }
        .alert { background: #ff7675; color: white; padding: 12px; border-radius: 14px; font-size: 13px; text-align: center; margin-top: 15px; font-weight: bold; }
        .recalc-btn { background: #00b894; margin-top: 15px; font-size: 15px; }
        
        .converter-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
        .conv-label { font-size: 12px; font-weight: bold; color: #7f8fa6; text-align: center; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>👦🏻 จัดการนมน้องอคิน 🍼</h1>
        
        <div class="input-group">
            <label>⚖️ น้ำหนักน้อง (กก.)</label>
            <input type="number" id="weight" class="config-input" step="0.1" inputmode="decimal" placeholder="5">
        </div>
        
        <div class="input-group">
            <label>🍽️ จำนวนมื้อต่อวัน (รวมกลางวัน 5 มื้อ)</label>
            <input type="number" id="feeds" class="config-input" inputmode="numeric" placeholder="6">
        </div>
        
        <button onclick="generateSchedule()">1. สร้างตารางเริ่มต้น 🧸</button>
        <div id="schedule-area"></div>
    </div>

    <div class="card" style="background: #f8f9fa;">
        <h2>⚖️ เครื่องมือแปลงหน่วย (1 oz = 30 ml)</h2>
        <div class="converter-grid">
            <div>
                <div class="conv-label">ออนซ์ (oz)</div>
                <input type="number" id="conv-oz" class="config-input" inputmode="decimal" placeholder="oz" oninput="convertUnit('oz')">
            </div>
            <div style="font-size: 20px; color: #d1d8e0;">⇌</div>
            <div>
                <div class="conv-label">มิลลิลิตร (ml)</div>
                <input type="number" id="conv-ml" class="config-input" inputmode="decimal" placeholder="ml" oninput="convertUnit('ml')">
            </div>
        </div>
    </div>

    <script>
        let scheduleData = [];

        window.onload = function() {
            let savedWeight = localStorage.getItem('akin_weight');
            let savedFeeds = localStorage.getItem('akin_feeds');
            
            if (savedWeight) document.getElementById('weight').value = savedWeight;
            if (savedFeeds) document.getElementById('feeds').value = savedFeeds;
        };

        function convertUnit(source) {
            const ozInput = document.getElementById('conv-oz');
            const mlInput = document.getElementById('conv-ml');
            
            if (source === 'oz') {
                let val = parseFloat(ozInput.value);
                mlInput.value = isNaN(val) ? '' : Math.round(val * 30);
            } else {
                let val = parseFloat(mlInput.value);
                ozInput.value = isNaN(val) ? '' : (val / 30).toFixed(2);
            }
        }

        function generateSchedule() {
            const w = parseFloat(document.getElementById('weight').value);
            const n = parseInt(document.getElementById('feeds').value);
            const area = document.getElementById('schedule-area');
            
            if (!w || !n || n < 5) return alert("รบกวนกรอกน้ำหนักและจำนวนมื้อให้ถูกต้องครับ");

            localStorage.setItem('akin_weight', w);
            localStorage.setItem('akin_feeds', n);

            const totalOz = w * 6;
            const maxCap = w * 1.2;
            const meanVol = totalOz / n;

            if (n * maxCap < totalOz) {
                area.innerHTML = `<div class="alert">⚠️ เป้าหมาย ${totalOz.toFixed(1)} oz เกินความจุกระเพาะสูงสุด กรุณาเพิ่มจำนวนมื้อครับ</div>`;
                return;
            }

            let times = ['06:00', '09:00', '12:00', '15:00', '18:00'];
            const nightFeeds = n - 5;
            if (nightFeeds > 0) {
                const nightGap = 12 / (nightFeeds + 1);
                let currentTime = 18;
                for (let i = 1; i <= nightFeeds; i++) {
                    currentTime += nightGap;
                    let hrs = Math.floor(currentTime) % 24;
                    let mins = Math.round((currentTime % 1) * 60);
                    let timeStr = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
                    times.push(timeStr);
                }
            }

            scheduleData = times.map((t) => {
                let isHeavy = (t === '06:00' || t === '18:00' || t >= '21:00' || t < '06:00');
                let vol = isHeavy ? (meanVol + 0.3 > maxCap ? maxCap : meanVol + 0.3) : (meanVol - 0.3 < 1 ? meanVol : meanVol - 0.3);
                return { time: t, vol: parseFloat(vol.toFixed(2)), status: 'pending' };
            });

            renderTable(totalOz, maxCap);
        }

        function renderTable(totalOz, maxCap) {
            const area = document.getElementById('schedule-area');
            
            let html = `<div class="summary-box">
                            🎯 เป้าหมายรวม: <b>${totalOz.toFixed(1)}</b> oz (${Math.round(totalOz * 30)} ml)<br>
                            เพดานกระเพาะ (ต่อมื้อ): <b>${maxCap.toFixed(1)}</b> oz (${Math.round(maxCap * 30)} ml)
                        </div>
                        <div class="table-container">
                        <table>
                            <tr><th>เวลา</th><th>ปริมาณ</th><th>สถานะ</th></tr>`;

            scheduleData.forEach((item, idx) => {
                let statusBg = item.status === 'done' ? '#e1f5fe' : '#fff';
                let mlVal = Math.round(item.vol * 30); 
                
                html += `<tr style="background: ${statusBg};">
                            <td><input type="text" class="row-time" id="time-${idx}" value="${item.time}"></td>
                            <td>
                                <input type="number" class="row-vol" id="vol-${idx}" step="0.1" inputmode="decimal" value="${item.vol}">
                                <span class="ml-badge">${mlVal} ml</span>
                            </td>
                            <td>
                                <select class="status-select" id="status-${idx}">
                                    <option value="pending" ${item.status==='pending'?'selected':''}>⏳ รอคำนวณ</option>
                                    <option value="done" ${item.status==='done'?'selected':''}>🍼 กินแล้ว</option>
                                </select>
                            </td>
                         </tr>`;
            });

            html += `</table></div>
                     <button class="recalc-btn" onclick="recalculateDynamic(${totalOz}, ${maxCap})">2. คำนวณชดเชยมื้อที่เหลือ ⚡️</button>`;
            area.innerHTML = html;
        }

        function recalculateDynamic(totalOz, maxCap) {
            let sumFixed = 0;
            let pendingIndices = [];

            scheduleData.forEach((item, idx) => {
                let tInput = document.getElementById(`time-${idx}`).value;
                let vInput = parseFloat(document.getElementById(`vol-${idx}`).value) || 0;
                let sInput = document.getElementById(`status-${idx}`).value;

                item.time = tInput;
                item.vol = vInput;
                item.status = sInput;

                if (item.status === 'done') {
                    sumFixed += item.vol; 
                } else {
                    pendingIndices.push(idx); 
                }
            });

            let remainingOz = totalOz - sumFixed;
            
            if (pendingIndices.length > 0) {
                let ozPerPending = remainingOz / pendingIndices.length;
                pendingIndices.forEach(idx => {
                    let assigned = ozPerPending;
                    if (assigned > maxCap) assigned = maxCap;
                    scheduleData[idx].vol = parseFloat(assigned.toFixed(2));
                });
            }

            renderTable(totalOz, maxCap);
        }
    </script>
</body>
</html>
